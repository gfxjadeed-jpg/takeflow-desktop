<!doctype html>
<!-- TakeFlow Tv - تصميم وتطوير محمد قندقلي
     1.9.11 (v965) — النافذة العريضة: صورة الوقت تملأ الخلفيّة، الساعة والتاريخ كبيران، بطاقةٌ زجاجيّة للتحميل والدخول، وتحميلٌ يقول متى يطول.
     1.9.9 (v935) — شاشة البداية: نافذةٌ صغيرة تظهر فوراً بلون وقت النهار وتقول ما يجري خطوةً خطوة (على طريقة Avid)،
     والنافذة الكبيرة لا تظهر إلّا والبرنامج جاهز. لا شبكة هنا ولا سكربت خارجيّ: كلّ ما تعرفه يصلها من main.js (tfSplash.on). -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file: data:">
<title>TakeFlow TV</title>
<style>
  /* 1.9.11 (v965) — محمد: «وسّع البوكس… التصميم أفضل… واللودنغ ممتاز ومتين». نافذةٌ عريضة (٨٨٠×٥٤٠) بصورة الوقت من «باب الدخول»
     تملأ الخلفيّة، والساعة والتاريخ كبيران كما في معاينة الباب، وبطاقةٌ زجاجيّة عريضة للتحميل والدخول (حقولٌ وأزرار ٤٤). */
  :root { color-scheme: dark; --ink: #ffffff; --ink2: rgba(255,255,255,.78); --glass: rgba(10,14,32,.58); --edge: rgba(255,255,255,.16); --acc: #f2a93b; --acc-ink: #1d1203; --ok: #4ade80; --bad: #ffb4a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: var(--ink); background: #0b1030; -webkit-app-region: drag; user-select: none; }
  button, input, label, form { -webkit-app-region: no-drag; }
  .splash { position: relative; height: 100%; display: grid; grid-template-rows: 1fr auto; overflow: clip; transition: background 1s; }   /* الصورة تكبر قليلاً ثمّ تستقرّ — لا تُخرج النافذة عن مقاسها */
  .splash.am { background: linear-gradient(160deg, #f6b55c 0%, #e9a96a 40%, #6f8fbf 100%); }
  .splash.noon { background: linear-gradient(160deg, #2f62b8 0%, #5d8ad6 55%, #a9c6ee 100%); }
  .splash.pm { background: linear-gradient(160deg, #23306a 0%, #a3557f 55%, #e7a874 100%); }
  .splash.night { background: linear-gradient(160deg, #070b22 0%, #141a46 60%, #2c2560 100%); }
  .sun { position: absolute; width: 180px; height: 180px; border-radius: 50%; inset-inline-end: 12%; top: 12%; background: radial-gradient(circle, rgba(255,255,255,.7), rgba(255,255,255,0) 70%); pointer-events: none; }
  .splash.night .sun { width: 90px; height: 90px; background: radial-gradient(circle at 35% 35%, #fff 0 38%, rgba(255,255,255,0) 72%); }
  /* صورة وقت النهار من إعدادات «الباب» (تصل جاهزةً من main.js) — تملأ النافذة، وظلٌّ من جهة البطاقة يجعل النصّ مقروءاً */
  .ph { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.04); transition: opacity 1s, transform 6s ease-out; pointer-events: none; }
  .ph.on { opacity: 1; transform: scale(1); }
  .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(270deg, rgba(4,7,20,.78) 0%, rgba(4,7,20,.42) 46%, rgba(4,7,20,.08) 72%, rgba(4,7,20,.35) 100%); }
  [dir=ltr] .shade { background: linear-gradient(90deg, rgba(4,7,20,.78) 0%, rgba(4,7,20,.42) 46%, rgba(4,7,20,.08) 72%, rgba(4,7,20,.35) 100%); }
  .splash.hasph .sun { display: none; }
  .x { position: absolute; z-index: 3; top: 12px; inset-inline-end: 12px; width: 36px; height: 36px; border: 1px solid var(--edge); border-radius: 10px; background: rgba(0,0,0,.28); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; }
  .x:hover { background: rgba(0,0,0,.45); }
  .stage { position: relative; z-index: 1; display: grid; grid-template-columns: 380px 1fr; gap: 28px; align-items: center; padding: 28px 32px 8px; min-height: 0; }
  /* البطاقة */
  .card { display: grid; gap: 16px; align-content: start; padding: 26px 26px 22px; border-radius: 20px; background: var(--glass); border: 1px solid var(--edge);
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); box-shadow: 0 24px 60px rgba(0,0,0,.35); text-align: start; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 34px; height: 34px; flex: none; }
  .logo { font-size: 24px; font-weight: 700; letter-spacing: .01em; direction: ltr; line-height: 1; }
  .logo small { display: block; margin-top: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; color: var(--ink2); }
  .greet { font-size: 20px; font-weight: 700; line-height: 1.4; min-height: 28px; }
  /* التحميل: الخطوات · شريطٌ بنسبته ولمعةٍ تمشي فيه · وإن طال قال ذلك وأعطى «افتح على أيّ حال» */
  .steps { display: grid; gap: 7px; font-size: 13.5px; }
  .st { display: flex; align-items: center; gap: 10px; color: var(--ink2); opacity: .6; transition: opacity .3s; }
  .st.on { opacity: 1; color: var(--ink); font-weight: 600; }
  .st.ok { opacity: .9; }
  .st i { position: relative; width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; display: inline-block; flex: none; }
  .st.on i { border-color: var(--acc); border-top-color: transparent; animation: spin .8s linear infinite; }
  .st.ok i { border-color: var(--ok); background: var(--ok); }
  .st.ok i::after { content: ''; position: absolute; inset-inline-start: 3px; top: 0; width: 4px; height: 8px; border: solid #0b1030; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .meter { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.16); overflow: clip; }
  .bar b { position: absolute; inset-block: 0; inset-inline-start: 0; min-width: 12px; border-radius: 3px; background: var(--acc); transition: width .5s ease; }
  .bar b::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); animation: shine 1.4s ease-in-out infinite; }
  .pct { font-size: 12.5px; font-weight: 700; direction: ltr; min-width: 38px; text-align: end; color: var(--ink2); }
  .slow { display: grid; gap: 8px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid var(--edge); font-size: 12.5px; line-height: 1.6; color: var(--ink2); }
  /* الدخول */
  .lg { display: grid; gap: 10px; }
  .lg input[type=text], .lg input[type=password] { font: inherit; font-size: 15px; min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.96); color: #14121f; direction: ltr; text-align: start; }
  .lg input::placeholder { color: #5d5a6e; }
  .lg input:focus-visible { outline: 3px solid var(--acc); outline-offset: 1px; }
  .btn:focus-visible, .x:focus-visible, .lnk:focus-visible, .lang:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .lg label.k { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; min-height: 32px; color: var(--ink2); }
  .lg label.k input { width: 18px; height: 18px; accent-color: var(--acc); }
  .lg .lerr { font-size: 13px; font-weight: 600; color: var(--bad); min-height: 0; }
  .lg .lerr:empty { display: none; }
  .lg .go { inline-size: 100%; }
  .lg .lnk { justify-self: center; border: 0; background: none; color: var(--ink2); font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 6px 4px; min-height: 32px; }
  .err { display: grid; gap: 10px; }
  .err b { font-size: 16px; }
  .err span { color: var(--ink2); line-height: 1.6; }
  .err small { color: var(--ink2); direction: ltr; text-align: start; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 12px; padding: 10px 18px; min-height: 44px; font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; background: var(--acc); color: var(--acc-ink); }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .btn.sec { background: rgba(255,255,255,.12); color: var(--ink); border: 1px solid var(--edge); }
  /* الساعة والتاريخ — كما في معاينة باب الدخول */
  .clock { align-self: end; justify-self: end; text-align: end; padding-block-end: 10px; text-shadow: 0 2px 18px rgba(0,0,0,.45); }
  .clock b { display: block; font-size: 64px; font-weight: 700; line-height: 1; direction: ltr; letter-spacing: -.01em; }
  .clock span { display: block; margin-top: 6px; font-size: 16px; font-weight: 600; }
  .foot { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 10px 32px 14px; font-size: 12.5px; color: var(--ink2); }
  .foot label { display: flex; align-items: center; gap: 8px; cursor: pointer; min-height: 32px; }
  .foot input { width: 18px; height: 18px; accent-color: var(--acc); }
  .foot .sp { flex: 1; }
  .ver { direction: ltr; }
  /* 1.9.10 — اللغة من شاشة البداية */
  .lang { -webkit-app-region: no-drag; min-height: 32px; padding: 4px 14px; border: 1px solid var(--edge); border-radius: 999px; background: rgba(0,0,0,.25); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  [hidden] { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shine { to { transform: translateX(100%); } }
  [dir=rtl] .bar b::after { animation-direction: reverse; }
  @media (prefers-reduced-motion: reduce) { .st.on i, .bar b::after { animation: none; } .ph, .splash, .bar b { transition: none; } .ph { transform: none; } }
</style>
</head>
<body>
<div class="splash night" id="sp">
  <div class="ph" id="ph"></div><div class="shade"></div>
  <span class="sun" aria-hidden="true"></span>
  <button class="x" id="x" type="button" aria-label="خروج" title="خروج">&#x2715;</button>
  <div class="stage">
    <section class="card" aria-labelledby="greet">
      <div class="brand">
        <svg class="mark" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="6" width="30" height="6" rx="3" fill="#f2a93b"/><rect x="2" y="15" width="22" height="6" rx="3" fill="#ffffff" opacity=".9"/><rect x="2" y="24" width="14" height="6" rx="3" fill="#ffffff" opacity=".55"/></svg>
        <div class="logo">TakeFlow<small>TV PRODUCTION</small></div>
      </div>
      <div class="greet" id="greet"></div>
      <div id="load">
        <div class="steps" id="steps" role="status" aria-live="polite"></div>
        <div class="meter"><div class="bar" aria-hidden="true"><b id="bar" style="width:0%"></b></div><span class="pct" id="pct"></span></div>
        <div class="slow" id="slow" hidden><span id="slow-t"></span><div class="btns"><button class="btn sec" id="slow-open" type="button"></button></div></div>
      </div>
      <form class="lg" id="lg" hidden novalidate>
        <input type="text" id="lg-u" autocomplete="username" spellcheck="false" autocapitalize="none" maxlength="64">
        <input type="password" id="lg-p" autocomplete="current-password" maxlength="256">
        <div class="lerr" id="lg-e" role="alert"></div>
        <label class="k" id="lg-kr"><input type="checkbox" id="lg-k"><span id="lg-kt"></span></label>
        <button class="btn go" id="lg-go" type="submit"></button>
        <button class="lnk" id="lg-open" type="button"></button>
      </form>
      <div class="err" id="err" hidden>
        <b id="err-t"></b><span id="err-m"></span><small id="err-d"></small>
        <div class="btns"><button class="btn" id="retry" type="button"></button><button class="btn sec" id="open" type="button"></button></div>
      </div>
    </section>
    <div class="clock" aria-hidden="true"><b id="clk"></b><span id="dt"></span></div>
  </div>
  <div class="foot">
    <label><input type="checkbox" id="auto"><span id="auto-t"></span></label>
    <span class="sp"></span>
    <button class="lang" id="lang" type="button"></button>
    <span class="ver" id="ver"></span>
  </div>
</div>
<script>
(function () {
  'use strict';
  var S = { stage: 'net', fail: null, lang: 'ar', tz: 'Asia/Beirut', name: '', autostart: false, version: '', photos: {}, login: false, err: '', user: '', saved: false, keep: false, busy: false };
  var SLOTS = ['am', 'noon', 'pm', 'night'];
  var STEPS = [['net', 'الاتّصال بالخادم', 'Connecting to the server'], ['page', 'تحميل الصفحة', 'Loading the page'], ['auth', 'قراءة حسابك', 'Reading your account'],
    ['data', 'تحميل طلباتك وبطاقاتك', 'Loading your requests and cards'], ['ready', 'جاهز', 'Ready']];
  var T = {
    greet: { am: ['صباح الخير', 'Good morning'], noon: ['نهارك سعيد', 'Good afternoon'], pm: ['مساء الخير', 'Good evening'], night: ['مساء النور', 'Good night'] },
    fail: ['تعذّر الوصول إلى الخادم', 'The server could not be reached'],
    failm: ['تأكّد من الشبكة. نعيد المحاولة وحدنا حين تعود.', 'Check the network. We retry by ourselves when it is back.'],
    retry: ['أعد المحاولة الآن', 'Retry now'], open: ['افتح على أيّ حال', 'Open anyway'],
    auto: ['ابدأ مع تشغيل الجهاز', 'Start when the computer starts'], ver: ['التطبيق ', 'App '], x: ['خروج', 'Quit'],
    u: ['اسم المستخدم', 'Username'], p: ['كلمة المرور', 'Password'], ps: ['محفوظة على هذا الجهاز', 'Saved on this computer'], go: ['ادخل', 'Sign in'],
    keep: ['تذكّرني على هذا الجهاز', 'Remember me on this computer'], lopen: ['افتح البرنامج للدخول بطريقةٍ أخرى', 'Open the app to sign in another way'],
    e_bad: ['الاسم أو كلمة المرور غير صحيحة — أعد كتابتهما.', 'Wrong username or password — type them again.'], e_empty: ['اكتب الاسم وكلمة المرور.', 'Type your username and password.'],
    e_net: ['تعذّر الوصول إلى خدمة الدخول — تحقّق من الشبكة وأعد المحاولة.', 'The sign-in service could not be reached — check the network and retry.'],
    e_license: ['ترخيص المحطّة لا يسمح بالدخول الآن — افتح البرنامج لترى السبب.', 'The station licence does not allow sign-in now — open the app to see why.'],
    slow: ['يأخذ هذا وقتاً أطول من العادة — ننتظر الخادم. يمكنك فتح البرنامج الآن وسيكمل وحده.', 'This is taking longer than usual — we are waiting for the server. You can open the app now and it will carry on.'] };
  var stageAt = Date.now(), SLOW_MS = 15000;   /* 1.9.11 — إن بقيت الخطوة نفسها ١٥ ثانية قالت الشاشة ذلك وأعطت «افتح على أيّ حال» */
  var $ = function (id) { return document.getElementById(id); };
  var ar = function () { return S.lang !== 'en'; };
  var L = function (k) { return T[k][ar() ? 0 : 1]; };
  /* وقت النهار بتوقيت المحطّة (لا الجهاز): الصباح ٥–١١ · الظهر ١١–١٧ · المساء ١٧–٢١ · الليل */
  function hourNow() {
    try { return +new Intl.DateTimeFormat('en-GB', { hour: '2-digit', hourCycle: 'h23', timeZone: S.tz }).formatToParts(new Date()).find(function (p) { return p.type === 'hour'; }).value % 24; }
    catch (e) { return new Date().getHours(); }
  }
  function slotAt(h) { return h >= 5 && h < 11 ? 'am' : h >= 11 && h < 17 ? 'noon' : h >= 17 && h < 21 ? 'pm' : 'night'; }
  /* صورة الوقت الآن — وإن خلا الوقت فصورة الوقت الذي قبله (دوراناً) كما في باب الدخول */
  function photoAt(slot) { var i = SLOTS.indexOf(slot); for (var k = 0; k < 4; k++) { var s = SLOTS[(i - k + 4) % 4]; if (S.photos && /^file:\/\//.test(S.photos[s] || '')) return S.photos[s]; } return ''; }
  function paint() {
    var slot = slotAt(hourNow()), sp = $('sp'), ph0 = photoAt(slot);
    document.documentElement.lang = ar() ? 'ar' : 'en'; document.documentElement.dir = ar() ? 'rtl' : 'ltr';
    sp.className = 'splash ' + slot + (ph0 ? ' hasph' : '');
    var ph = $('ph'); if (ph0) { ph.style.backgroundImage = 'url("' + ph0.replace(/["\\()]/g, '') + '")'; ph.classList.add('on'); } else { ph.style.backgroundImage = ''; ph.classList.remove('on'); }
    $('greet').textContent = T.greet[slot][ar() ? 0 : 1] + (S.name ? (ar() ? '، ' : ', ') + S.name : '');
    var idx = -1; STEPS.forEach(function (s, i) { if (s[0] === S.stage) idx = i; });
    $('steps').innerHTML = STEPS.map(function (s, i) {
      var c = i < idx ? 'ok' : (i === idx && !S.fail) ? 'on' : '';
      return '<div class="st ' + c + '"><i aria-hidden="true"></i><span>' + (ar() ? s[1] : s[2]) + '</span></div>';
    }).join('');
    var pc = Math.round(Math.max(0, idx) / (STEPS.length - 1) * 100); $('bar').style.width = pc + '%'; $('pct').textContent = pc + '%';
    var slow = !S.fail && !S.login && S.stage !== 'ready' && Date.now() - stageAt > SLOW_MS;
    $('slow').hidden = !slow; $('slow-t').textContent = L('slow'); $('slow-open').textContent = L('open');
    clock();
    var lg = !S.fail && S.login;
    $('load').hidden = !!S.fail || lg; $('err').hidden = !S.fail; $('lg').hidden = !lg;
    if (lg) {
      $('lg-u').placeholder = L('u'); $('lg-p').placeholder = S.saved ? L('ps') : L('p'); $('lg-u').setAttribute('aria-label', L('u')); $('lg-p').setAttribute('aria-label', L('p'));
      if (!$('lg-u').value && S.user) $('lg-u').value = S.user;
      $('lg-e').textContent = S.err && T['e_' + S.err] ? L('e_' + S.err) : '';
      $('lg-kr').hidden = !S.keep; $('lg-kt').textContent = L('keep'); if (S.saved && !$('lg').dataset.k) { $('lg-k').checked = true; $('lg').dataset.k = '1'; }
      $('lg-go').textContent = L('go'); $('lg-go').disabled = !!S.busy; $('lg-open').textContent = L('lopen');
      if (!$('lg').dataset.f) { $('lg').dataset.f = '1'; setTimeout(function () { try { ($('lg-u').value ? $('lg-p') : $('lg-u')).focus(); } catch (e) {} }, 30); }
    }
    if (S.fail) { $('err-t').textContent = L('fail'); $('err-m').textContent = L('failm'); $('err-d').textContent = String(S.fail.desc || '') + (S.fail.code ? ' (' + S.fail.code + ')' : ''); }
    $('retry').textContent = L('retry'); $('open').textContent = L('open');
    $('auto-t').textContent = L('auto'); $('auto').checked = !!S.autostart;
    $('ver').textContent = S.version ? L('ver') + S.version : '';
    $('x').title = L('x'); $('x').setAttribute('aria-label', L('x'));
    /* 1.9.10 — الزرّ باسم اللغة الأخرى بلغتها، وعنوانه بلغة الشاشة */
    $('lang').textContent = ar() ? 'English' : 'عربي'; $('lang').lang = ar() ? 'en' : 'ar';
    $('lang').title = ar() ? 'اعرض البرنامج بالإنكليزيّة' : 'Show the app in Arabic'; $('lang').setAttribute('aria-label', $('lang').title);
  }
  var api = window.tfSplash;
  function cmd(c, o) { try { if (api && typeof api.cmd === 'function') api.cmd(c, o || {}); } catch (e) {} }
  $('retry').addEventListener('click', function () { S.fail = null; S.stage = 'net'; paint(); cmd('retry'); });
  $('open').addEventListener('click', function () { cmd('open'); });
  $('slow-open').addEventListener('click', function () { cmd('open'); });
  $('x').addEventListener('click', function () { cmd('quit'); });
  $('lg').addEventListener('submit', function (e) {
    e.preventDefault();
    var u = $('lg-u').value.trim(), p = $('lg-p').value;
    if (!u || (!p && !S.saved)) { S.err = 'empty'; paint(); return; }
    S.err = ''; S.busy = true; S.login = false; S.stage = 'auth'; paint();
    $('lg-p').value = '';   /* لا تبقى الكلمة في الحقل */
    try { if (api && typeof api.login === 'function') api.login(u, p, !!$('lg-k').checked); } catch (er) {}
  });
  $('lg-open').addEventListener('click', function () { cmd('open'); });
  $('lang').addEventListener('click', function () { S.lang = ar() ? 'en' : 'ar'; paint(); cmd('lang', { lang: S.lang }); });   /* 1.9.10 */
  $('auto').addEventListener('change', function () { S.autostart = !!$('auto').checked; cmd('autostart', { on: S.autostart }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cmd('open'); });
  if (api && typeof api.on === 'function') api.on(function (d) {
    d = (d && typeof d === 'object') ? d : {};
    if (d.lang === 'ar' || d.lang === 'en') S.lang = d.lang;
    if (typeof d.tz === 'string' && d.tz) S.tz = d.tz;
    if (typeof d.name === 'string') S.name = d.name;
    if (typeof d.version === 'string') S.version = d.version;
    if (typeof d.autostart === 'boolean') S.autostart = d.autostart;
    if (d.photos && typeof d.photos === 'object') S.photos = d.photos;
    if (typeof d.login === 'boolean') S.login = d.login;
    if (typeof d.err === 'string') S.err = d.err;
    if (typeof d.user === 'string') S.user = d.user;
    if (typeof d.saved === 'boolean') S.saved = d.saved;
