# TakeFlow Tv - تصميم وتطوير محمد قندقلي
# ═══════════════════════════════════════════════════════════════════
#  إصدار التطبيق المكتبيّ من GitHub — بلا بناءٍ على جهازك (v614)
#  يوضع هذا الملفّ في مستودع takeflow-desktop العامّ (محتوى مجلّد desktop/ في جذره).
#  وسمٌ جديد (v1.3.3) ← يبني GitHub مثبّت ويندوز ومعه ffmpeg ← يُنشر Release
#  ومعه latest.yml والـblockmap — فتلتقطه الأجهزة من «مصدر التحديث» وحدها.
#  التوكن من GitHub نفسه (GITHUB_TOKEN) — لا سرّ يُنسخ ولا يُحفظ.
# ═══════════════════════════════════════════════════════════════════
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # الوسم والإصدار واحد: v1.3.3 ↔ "version": "1.3.3" — وإلّا يتوقّف قبل أن يُنشر شيء
      - name: version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          T="${GITHUB_REF_NAME#v}"
          if [ "$V" != "$T" ]; then echo "::error::package.json version $V ≠ tag $GITHUB_REF_NAME — ارفع version ثمّ أعد الوسم"; exit 1; fi

      # المستودع الذي يُنشر فيه: هذا المستودع نفسه (لا GITHUB-USER يدويّاً)
      - name: publish target = this repository
        shell: bash
        run: |
          node -e "const f='package.json',p=require('./'+f);p.build.publish=[{provider:'github',owner:process.env.O,repo:process.env.R,releaseType:'release'}];require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
        env:
          O: ${{ github.repository_owner }}
          R: ${{ github.event.repository.name }}

      # ffmpeg للمعاينة الخفيفة (MXF وما لا يقرؤه المتصفّح) — يُرفق في resources/ffmpeg
      - name: ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vendor/ffmpeg-win | Out-Null
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $exe = Get-ChildItem -Recurse -Path ff -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName vendor/ffmpeg-win/ffmpeg.exe
          & vendor/ffmpeg-win/ffmpeg.exe -version | Select-Object -First 1

      - name: install
        run: npm install --no-audit --no-fund

      - name: build and publish
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # البصمة للموظّفين (SHA-256) في سجلّ التشغيل
      - name: sha256
        shell: pwsh
        run: Get-ChildItem dist/*.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash, $_.Name }
